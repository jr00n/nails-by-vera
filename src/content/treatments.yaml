# De drie behandelgroepen van de site.
#
# Alle copy is letterlijk overgenomen uit de desktoprender van
# design_handoff_nailsbyvera/Behandelingen.dc.html en mag niet herschreven
# worden (PRD §5.5).
#
# Duur en prijs komen ook uit het handoff-pakket:
#   - prijs: Prijzen.dc.html (de bedragen van de prijzenpagina, samengevat tot
#     het bereik van de groep). LET OP: dat bereik is een samenvatting van de
#     regels in `prices.yaml`. Wie daar een tarief wijzigt, controleert hier of
#     het bereik nog klopt — de behandelingenpagina toont per groep alleen het
#     bereik, de prijzenpagina alle losse regels.
#   - duur:  de mobiele render van de homepagina — 90 min versteviging,
#     120 min met verlenging, 60 min gellak
#
# TODO (TASK-4): de definitieve behandelduur in minuten moet van Vera komen.
# De huidige site vermeldt nergens een duur, en wat hier staat is het enige wat
# het ontwerp geeft. Zodra de FAQ-antwoorden binnen zijn: deze drie regels
# controleren en zo nodig bijstellen.

versteviging:
  order: 1
  eyebrow: Hard gel
  title: Extra sterke versteviging
  label: Nagelversteviging
  intro: >-
    Extra stevig: het buigt en breekt niet snel. Ideaal voor lange of kwetsbare
    nagels. Inclusief eventuele vormcorrectie en standaard een uitgebreide
    e-manicure. Ook mogelijk met verlenging. Zo heb je direct langere nagels in
    de vorm en lengte die jij wilt.
  bullets:
    - Uitgebreide e-manicure inbegrepen
    - Vormcorrectie waar nodig
    - Met of zonder verlenging
    - Ook voor broze nagels
  duration: 90-120 min
  price: Vanaf €60
  photo: rozeAmandelRingen

biab:
  order: 2
  eyebrow: BIAB
  title: Flexibele versteviging
  label: BIAB
  intro: >-
    Flexibele versteviging: soepel, licht en natuurlijk. Perfect voor kortere
    nagels. Kies zelf voor een behandeling inclusief of exclusief uitgebreide
    e-manicure. Met eventuele vormcorrectie, zodat je nagels er in elke lengte
    verzorgd uitzien.
  bullets:
    - Soepel en licht op je nagel
    - Perfect voor kortere nagels
    - E-manicure optioneel bij te boeken
    - Vormcorrectie waar nodig
  duration: 90 min
  price: Vanaf €35
  photo: dieproodAmandel

gellak:
  order: 3
  eyebrow: Gellak
  title: Kleur op eigen nagels
  label: Gellak
  intro: >-
    Gellak, ook bekend als 'semi-permanente nagellak', biedt een moeiteloze
    oplossing voor langdurig mooie nagels. In tegenstelling tot gewone nagellak
    blijft gellak tot wel 2 tot 3 weken zitten, afhankelijk van de conditie van
    je nagels. Ideaal voor dames met natuurlijk sterke nagels die langdurig
    willen genieten van prachtig gekleurde nagels zonder veel onderhoud.
  bullets:
    - Tot wel 2 tot 3 weken mooi
    - Ruim kleurassortiment
    - Uitgebreide e-manicure optioneel bij te boeken
    - Perfect voor korte, sterke nagels
  duration: 60 min
  price: Vanaf €30
  photo: bordeauxGlitter

nail-art:
  order: 4
  eyebrow: Nail art
  title: Een wauw factor voor jouw nagels
  label: Nail art
  intro: >-
    Ontdek eindeloze mogelijkheden om je nagels een unieke uitstraling te geven!
    Ervaar de diversiteit in prijs en stijl, vanaf €5 voor minimalistische
    designs, ga echt NEXT LEVEL voor €30 met uitgebreide en unieke designs, of
    alles daartussenin. Kies uit een scala aan patronen zoals lijnen, stippen,
    schattige figuurtjes, prachtige meerkleurige designs, schitterende
    steentjes, en glitter-details. Voeg luxe toe met bladgoud, zilver, rosé
    gouden details! Voor een klassiekere touch zijn 'french manicure' en een
    subtiele 'babyboom' ook beschikbaar.
  bullets:
    - 'Minimal: vanaf €5'
    - 'Simple but cute: €10'
    - 'Artsy: €17,50'
    - 'Next level: €30'
  # Nail art wordt per set geprijsd en bovenop een andere behandeling gedaan;
  # de prijzenpagina zegt daarover: "de tijd plan ik gewoon voor je in".
  duration: Per set ingepland
  price: Vanaf €5
  photo: nailartSmileys
