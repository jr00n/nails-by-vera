# Het portfolioraster: welke foto's, in welke volgorde en hoe groot de tegel is.
#
# `photo` verwijst naar een sleutel in src/data/images.ts. Daar staan ook bestand,
# alt-tekst en `categories`: onder welke filters (versteviging, gellak, nailart)
# de foto verschijnt. Eén foto kan onder meerdere filters staan. De categorie
# staat bewust alleen daar, zodat een foto die ook elders op de site staat niet
# op twee plekken beschreven hoeft te worden.
#
# `span`: large is 2x2, wide is twee kolommen breed. Het ritme herhaalt zich per
# negen tegels (large op 1, wide op 4, large op 7) en vult het raster zonder
# gaten zolang het aantal een veelvoud van negen is; nu 27. Zet large en wide
# bij voorkeur op een brede of vierkante foto.

